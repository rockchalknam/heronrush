<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heron Rush</title>
<style>
  html,body{margin:0;height:100%;background:#0b0618;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #fs{position:fixed;right:10px;bottom:10px;z-index:2;font:600 13px system-ui,sans-serif;color:#f2eefc;
      background:rgba(28,18,54,.85);border:1px solid #3a2a66;border-radius:8px;padding:6px 10px;cursor:pointer}
  #fs:hover{border-color:#3ee6ff}
</style>
</head>
<body>
<!-- Heron Rush: Mr. Nam's classroom doorway to Challenge Rush (used with the developers' permission).
     The game itself runs from the developers' official site inside this frame.
     Students: always use THIS link so your saved levels stay in one place. -->
<iframe id="game" src="https://challengerush.github.io/" title="Challenge Rush"
        allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
<button id="fs" type="button">⛶ Fullscreen</button>
<script>
  const f = document.getElementById("game");
  document.getElementById("fs").onclick = () => {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  };
  f.addEventListener("load", () => f.focus());
</script>
</body>
</html>
